services:
  mariadb:
    image: mariadb:11.8
    container_name: vector-rag-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root-dev-password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-vector_rag}
      MARIADB_USER: ${MARIADB_USER:-rag_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-rag-dev-password}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb_data:
